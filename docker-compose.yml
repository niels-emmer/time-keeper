services:

  # Frontend: React SPA served by nginx, proxies /api/* to backend
  #
  # Auth: the app owns it by default (AUTH_MODE=local). Users sign in at the
  # app's own /login with password + optional TOTP; sessions are server-side and
  # revocable. The Authentik forward-auth header path still exists behind
  # AUTH_MODE=proxy (or hybrid during a staged migration) and needs NPM's
  # forward-auth host config; in that mode nginx passes X-authentik-email to the
  # backend.
  #
  # SECURITY (C-1): this service deliberately publishes NO host ports. In proxy
  # mode, publishing :80 would let anyone who can reach the host send
  # X-authentik-email and be authenticated as that user, because nginx stamps the
  # internal token onto whatever identity header arrives. NPM must instead reach
  # it as `frontend:80` over the external `proxy-net` network below. In local
  # mode the same rule holds: no port is published.
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    restart: unless-stopped
    environment:
      # Shared with the backend — nginx sets this as X-Internal-Token on every
      # proxied request so the backend can distinguish trusted internal requests
      # (via the frontend nginx) from direct api.* calls. Generate once with:
      #   openssl rand -hex 32
      # and set in a .env file or your deployment secrets manager.
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:-}
    networks:
      - proxy-net
    depends_on:
      backend:
        condition: service_healthy

  # Backend: Express API with SQLite
  #
  # SECURITY (C-1): no host ports either. NPM reaches it as `backend:3001` over
  # `proxy-net` for the api.* Bearer-token subdomain. The backend additionally
  # rejects X-authentik-email from a non-private peer (TRUSTED_PROXY_CIDRS).
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      args:
        # Optional explicit version override. When omitted, the Docker build
        # falls back to the latest git tag, then packages/backend/package.json.
        APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_PATH: "/data/time-keeper.db"
      # Must match the frontend container's INTERNAL_PROXY_SECRET.
      # When set, the backend only accepts X-authentik-email from requests that
      # carry a matching X-Internal-Token header — preventing header injection
      # via the api.* subdomain even if NPM is misconfigured.
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:-}
      # Auth configuration. The backend refuses to boot in production without
      # SESSION_SECRET and MFA_ENCRYPTION_KEY, and ADMIN_EMAIL must name an
      # existing account on a migrated database. These are passed through and
      # validated by the backend at boot rather than duplicated as compose-time
      # requirements, so the failure message names the missing variable.
      #
      # AUTH_MODE: local (default) is the app's own password + TOTP login.
      #   proxy   = Authentik header path (NPM forward auth still required).
      #   hybrid  = accept both during a staged migration.
      # Also passed through so a `.env` file or the deployment secret store is
      # the single source of truth for all four values.
      AUTH_MODE: ${AUTH_MODE:-local}
      # On a migrated database this must be one of the pre-existing emails; it
      # is promoted to role='admin' at boot. On a brand-new empty database the
      # backend creates the first administrator and prints a one-time reset
      # code to the logs (see docs/operations/deployment.md).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # REQUIRED in production. Generate once and keep them stable:
      #   SESSION_SECRET:     openssl rand -base64 48
      #   MFA_ENCRYPTION_KEY: openssl rand -base64 32
      # Changing MFA_ENCRYPTION_KEY invalidates every enrolled TOTP secret.
      SESSION_SECRET: ${SESSION_SECRET:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
    volumes:
      - db-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy-net

volumes:
  db-data:
    driver: local

networks:
  proxy-net:
    external: true
