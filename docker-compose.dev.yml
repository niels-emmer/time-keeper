# Development overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Or run locally without Docker:
#   yarn workspace @time-keeper/backend dev
#   yarn workspace @time-keeper/frontend dev

services:
  # Local login is the development path (Q21). The backend seeds a dev admin
  # (admin@localhost / devadmin) with DEV_ADMIN_PASSWORD, so the real login,
  # session and MFA code is what gets exercised. DEV_USER_ID is a proxy-mode
  # shortcut only and is not set here.
  frontend:
    build: null
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && yarn workspace @time-keeper/frontend dev --host 0.0.0.0"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://backend:3001"
    depends_on:
      - backend

  backend:
    build: null
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && yarn workspace @time-keeper/backend dev"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/backend/node_modules
      - ./dev-data:/data
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_PATH: "/data/time-keeper.db"
      AUTH_MODE: "local"
      # Dev-only convenience so the seeded admin is predictable. Change or
      # unset it to have a random password printed once at first boot.
      DEV_ADMIN_PASSWORD: "${DEV_ADMIN_PASSWORD:-dev-admin-password}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
