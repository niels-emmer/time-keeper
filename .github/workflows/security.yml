# .github/workflows/security.yml
name: Security scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Node 25+ no longer ships Corepack, so install it before enabling Yarn.
      - name: Enable Yarn 4
        run: |
          npm install --global corepack@latest
          corepack enable
          yarn --version

      - name: Install deps
        run: yarn install --immutable

      # `yarn audit` does not exist in Yarn 4, and `continue-on-error` hid the
      # fact that this job never audited anything (finding M-7).
      - name: Dependency audit
        run: yarn npm audit --all --recursive --severity high

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (deps + secrets + IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
